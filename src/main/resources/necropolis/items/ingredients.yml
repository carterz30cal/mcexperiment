hydra_flesh:
  name: Hydra Flesh
  type: INGREDIENT
  rarity: RARE
  material: PRISMARINE_SHARD
  value: 15
  lore:
    - A small scrap of flesh dropped by slaying a head
    - of a hydra. Does not require permanently killing
    - the beast, but captures a small amount of the regenerative
    - power of it. Used to improve weaponry and produce
    - health-boosting armour pieces.

hydra_heart:
  name: Hydra Heart
  type: INGREDIENT
  rarity: VERY_RARE
  material: RED_DYE
  value: 100
  lore:
    - The beating heart of a great Hydra. Can only
    - be obtained by permanently slaying the beast.