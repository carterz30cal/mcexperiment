bone_dust:
  name: Bone Dust
  type: INGREDIENT
  rarity: COMMON
  material: LIGHT_GRAY_DYE
  discovery: bone_dust_collection
  discovery-progress: 1
  value: 3
  lore:
    - Finely powdered warrior bone.
    - Found throughout Necropolis abundantly.

calmed_spirit:
  name: Calmed Spirit
  type: INGREDIENT
  rarity: RARE
  material: ALLAY_SPAWN_EGG
  discovery: calmed_spirit_collection
  discovery-progress: 1
  value: 100
  lore:
    - Apparently, spirits can take a form. These
    - have calmed into a somewhat goopy syrup.
    - Found by slaying Sword Spirits.

incensed_spirit:
  name: Incensed Spirits
  type: INGREDIENT
  rarity: EPIC
  material: ALLAY_SPAWN_EGG
  glow: true
  discovery: calmed_spirit_collection
  discovery-progress: 16
  value: 1500
  lore:
    - Compressing calm spirits into a small space
    - and assaulting them with chilli powder
    - will, generally, make them angry again.


roasted_bone_dust:
  name: Roasted Bone Dust
  type: INGREDIENT
  rarity: VERY_RARE
  material: BLACK_DYE
  discovery: bone_dust_collection
  discovery-progress: 300
  value: 850
  lore:
    - Warrior bone, roasted into a aromatic powder.
    - Makes a great treat for pets.

red_slime:
  name: Red Slime
  type: INGREDIENT
  rarity: COMMON
  material: PLAYER_HEAD
  skull-profile-id: red_slime
  discovery: rainbow_slime_collection
  discovery-progress: 1
  value: 2
  lore:
    - Slightly higher grade slime than the green stuff, it
    - can handle higher temperatures for longer durations
    - before degrading. Unlike green slime, it does not
    - taste good in jams, nor other conserves.
    - Oozes from cracks in the walls of Necropolis.

necropolis_fish:
  name: Necropolis Puffer
  type: INGREDIENT
  rarity: COMMON
  material: PUFFERFISH
  discovery: necropolis_fish_collection
  discovery-progress: 1
  value: 4
  lore:
    - A highly unusual species of pufferfish in that it
    - lives in the frigid waters of Necropolis, which
    - is unsuitable for all other puffers. These are
    - a local delicacy, being completely nontoxic, buttery
    - and a little sweet, if prepared correctly.

cooked_necropolis_fish:
  name: Fried Puffer
  type: INGREDIENT
  rarity: VERY_RARE
  material: PUFFERFISH
  discovery: necropolis_fish_collection
  discovery-progress: 192
  value: 768
  lore:
    - Fried pufferfish is a delicacy in Necropolis, especially
    - due to the difficulty in preparing such a dish, as the
    - flesh burns easily. These were once consumed before
    - great battles in the days gone. There are rumours that
    - there were once cookbooks that had methods for greater success
    - in preparation of such a delicate breed of fish.

