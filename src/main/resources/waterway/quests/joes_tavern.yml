joe_tavern_2:
  name: Joe's Tavern II
  repeatable: false
  class: KillTagQuest
  tag: LUNATIC_WARRIOR
  count: 12
  pretty-name: Lunatic Warriors
  npc:
    name: Injured Joe
    location: -96.5, 68, 32, 90, 0
    representation: joe_tavern_joe_2
    focus-radius: 0
  requirement:
    class: CompleteQuestRequirement
    quest: joe_tavern_1
  reward:
    class: QuestReward
    xp: 10
  dialog:
    voice: Joe
    beginning:
      - <red>Ow...
      - I've really done it this time...
      - I got <red>ambushed</red> by some lunatic warriors whilst putting up my advertisements, and well, now I'm in this state.
      - I'll recover, eventually, but the sheer anger at this humiliation is hindering my recovery and my business brain!
      - Could you help me solve this problem by getting revenge on the lunatics?
      - They should be in the camp just ahead.
    chatter:
      - I'll happily sell you <gold>ale</gold> once you've given me a hand.
      - I could probably do with hiring some staff.
      - Somehow I feel less lonely out here covered in my own blood.
      - I don't think lunatics will be welcome in my bar.
      - Has anyone ever figured out what created the lunatics?
      - <red>*cough cough*</red>
      - Hey, at least I got the posters up.
    ending:
      - That makes me feel better, thanks.
      - <red>*cough cough*</red>
      - I'll see you in the tavern. Better hope the posters work!

joe_tavern_3:
  name: Joe's Tavern III
  repeatable: false
  class: FightClubQuest
  enemy: joe_tavern_patron_aggressive
  location: -38.7, 82, 30.5
  npc:
    name: Joe
    location: -44.225, 76, 21.3, -170, 11
    representation: joe_tavern_joe_1
    focus-radius: 4
  requirement:
    class: CompleteQuestRequirement
    quest: joe_tavern_2
  reward:
    class: ItemQuestReward
    xp: 10
    items:
      - potion_ale£1
  dialog:
    voice: Joe
    beginning:
      - Hiya!
      - I'm feeling better now, thank you.
      - As you can see, we've got a few patrons now!
      - Unfortunately though, a couple have been scared off by some thug upstairs.
      - Any chance you could.. get rid of the problem?
      - Talk to me again if it's too much for you.
    chatter:
      - I guess I'll just have to hire a bouncer.
    ending:
      - Cheers for that. Have a pint, on me.
      - I'm sure I'll have other work for you to do, so come back anytime!

