joe_tavern_jam_lover:
  name: Joe's Tavern (Jam Lover)
  repeatable: false
  class: CollectQuest
  item: green_slime
  count: 2
  consume: true
  npc:
    name: Jam Lover Letty
    location: -45.5, 76, 18.5, -1, 25
    representation: joe_tavern_patron_aggressive
    focus-radius: 5
  requirement:
    class: CompleteQuestRequirement
    quest: joe_tavern_2
  reward:
    class: ItemQuestReward
    xp: 2
    items:
      - chilli_powder£4
      - weak_silk_mass£1
  dialog:
    voice: Letty
    beginning:
      - Hi..
      - I really love jam, but this place doesn't serve it apparently.
      - I don't know what I'm going to have on my toast at breakfast!
      - Could you find me some <green>green slime?</green>
      - It makes very tasty jams.
    chatter:
      - I don't really like spiced meats nor waterway cod.
      - My one true passion is surfing. But jam is pretty nice too.
      - Green slime is only really found inside sea slimes, at least in Waterway.
    ending:
      - Breakfast is saved!
      - Thank you!
      - Take this assortment of chilli powders I had lying around.