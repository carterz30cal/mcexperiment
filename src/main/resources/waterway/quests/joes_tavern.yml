joe_tavern_1:
  name: Joe's Tavern I
  repeatable: false
  class: CollectQuest
  item: paper
  count: 1
  consume: true
  npc:
    name: Lonely Joe
    location: -43.3, 76, 21.7, 180, 13
    representation: joe_tavern_joe_1
  reward:
    class: QuestReward
    xp: 5
  dialog:
    voice: Joe
    beginning:
      - Welcome to Joe's!
      - I'm Joe!
      - As you can see, my bar is extremely empty. I just picked up the place and it seems like the last owner didn't do any advertising whatsoever!
      - Help me out for the good of Waterway and my bank account!
      - Could you fetch me some paper to make posters with?
    chatter:
      - I'll happily sell you <gold>ale</gold> once you've given me a hand.
      - I could probably do with hiring some staff.
      - It's very lonely in here!
      - Can you believe this place cost me <gold>600k coins?</gold>
    ending:
      - Amazing. You're a star.
      - I'll go put these posters up and hopefully we'll have some custom shortly!

