joe_tavern_demanding_customer:
  name: Joe's Tavern (Demanding)
  repeatable: false
  class: CollectQuest
  item: chilli_powder
  count: 7
  consume: true
  npc:
    name: Demanding Patron
    location: -45.4, 76, 30.675, -130, 3
    representation: joe_tavern_patron_aggressive
    focus-radius: 7
  requirement:
    class: CompleteQuestRequirement
    quest: joe_tavern_2
  reward:
    class: QuestReward
    xp: 2
    coins: 300
  dialog:
    voice: Demanding Patron
    beginning:
      - HELLO? SERVICE? PLEASE?
      - YOU! YOU LOOK LIKE A WAITER.
      - THIS SPICED MEAT SHOULD BE CALLED BLAND MEAT.
      - GET ME MORE CHILLI POWDER TO SEASON IT PROPERLY. THIS IS NOT A REQUEST
    chatter:
      - PRONTO.
      - HURRY UP! YOU DON'T GET PAID FOR NOTHING
      - No my name isn't Karen?
      - SERIOUSLY, WHAT LEVEL OF SPICE IS THIS SUPPOSED TO BE? NANDOS GARLIC AND HERB?
      - ITS CHILLI POWDER, NOT CHILI. THERE'S TWO Ls IN CHILLI.
    ending:
      - Well, that's certainly tastier.
      - Here, have a tip I guess.
      - Now get out of my sight!

